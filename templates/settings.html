{% extends 'base.html' %}

{% block title %}Clinic Settings - DermaCare{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">Clinic Settings</h1>
            <p class="text-sm text-slate-500">Configure Doctor and Clinic information displayed on dashboards and printed prescriptions.</p>
        </div>
        <a href="{{ url_for('dashboard') }}" class="px-4 py-2 text-slate-700 bg-white border border-slate-200 rounded-xl text-sm font-semibold hover:bg-slate-50 transition duration-150 flex items-center space-x-1 shadow-sm">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Back</span>
        </a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="p-6 bg-slate-50 border-b border-slate-100 flex items-center space-x-2">
            <i data-lucide="settings" class="w-5 h-5 text-teal-600"></i>
            <h2 class="font-bold text-slate-800">Clinic & Doctor Details</h2>
        </div>

        <form action="{{ url_for('settings') }}" method="POST" class="p-8 space-y-6">
            <!-- Doctor Name -->
            <div>
                <label for="doctor_name" class="block text-sm font-semibold text-slate-700 mb-2">Doctor Name</label>
                <input type="text" id="doctor_name" name="doctor_name" value="{{ settings.get('doctor_name', '') }}" required
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition duration-150">
            </div>

            <!-- Doctor Specialty / Degrees -->
            <div>
                <label for="doctor_specialty" class="block text-sm font-semibold text-slate-700 mb-2">Specialty & Qualifications</label>
                <input type="text" id="doctor_specialty" name="doctor_specialty" value="{{ settings.get('doctor_specialty', '') }}" required
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition duration-150"
                       placeholder="e.g. MBBS, MD (Dermatology) - Skin Specialist">
            </div>

            <!-- Clinic Name -->
            <div>
                <label for="clinic_name" class="block text-sm font-semibold text-slate-700 mb-2">Clinic Name</label>
                <input type="text" id="clinic_name" name="clinic_name" value="{{ settings.get('clinic_name', '') }}" required
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition duration-150">
            </div>

            <!-- Clinic Contact Phone -->
            <div>
                <label for="clinic_phone" class="block text-sm font-semibold text-slate-700 mb-2">Contact Phone Number</label>
                <input type="text" id="clinic_phone" name="clinic_phone" value="{{ settings.get('clinic_phone', '') }}" required
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition duration-150">
            </div>

            <!-- Clinic Address -->
            <div>
                <label for="clinic_address" class="block text-sm font-semibold text-slate-700 mb-2">Clinic Address</label>
                <textarea id="clinic_address" name="clinic_address" rows="3" required
                          class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition duration-150">{{ settings.get('clinic_address', '') }}</textarea>
            </div>

            <!-- Submit Button -->
            <div class="pt-4 border-t border-slate-100 flex justify-end">
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-6 py-3 rounded-xl shadow-sm hover:shadow transition duration-150 flex items-center space-x-2">
                    <i data-lucide="save" class="w-5 h-5"></i>
                    <span>Save Settings</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
